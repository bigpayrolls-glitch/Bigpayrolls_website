name: E2E test (temporary)
on:
  push:
    branches: [e2e-test]
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_USE_EMULATORS: '1'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-bp
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-bp.firebaseapp.com
      - run: npm install --no-save playwright@1.48.2 firebase-tools@14 && npx playwright install --with-deps chromium
      - run: (python3 -m http.server 3000 --directory out >/dev/null 2>&1 &) && sleep 2
      - run: npx firebase emulators:exec --only auth,firestore --project demo-bp "node e2e/run.mjs" 2>&1 | tee e2e.log; exit ${PIPESTATUS[0]}
      - if: always()
        run: |
          git config user.name "e2e-bot"; git config user.email "e2e-bot@users.noreply.github.com"
          git add -f e2e/shots e2e.log && git commit -m "E2E screenshots" && git push || true
