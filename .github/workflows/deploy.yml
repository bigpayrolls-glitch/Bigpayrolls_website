# Builds the site and deploys it to Firebase Hosting on every push to main.
# Needs ONE GitHub repository secret (Settings > Secrets and variables > Actions):
#   FIREBASE_SERVICE_ACCOUNT - the full JSON key from Firebase > Project settings > Service accounts
# The public Firebase web config lives in .env.production.
# Optional secrets: NEXT_PUBLIC_CONTACT_PHONE, NEXT_PUBLIC_CONTACT_EMAIL, NEXT_PUBLIC_WHATSAPP_NUMBER
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_CONTACT_PHONE: ${{ secrets.NEXT_PUBLIC_CONTACT_PHONE }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ secrets.NEXT_PUBLIC_CONTACT_EMAIL }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}

      - name: Check deploy key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::FIREBASE_SERVICE_ACCOUNT secret is empty or missing"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          python3 - "$RUNNER_TEMP/sa.json" <<'PY'
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
          except Exception as e:
              print(f"::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON (was the whole file pasted?): {e}")
              sys.exit(1)
          missing = [k for k in ("type", "project_id", "private_key", "client_email") if k not in d]
          if missing:
              print(f"::error::FIREBASE_SERVICE_ACCOUNT is missing fields: {missing}")
              sys.exit(1)
          print(f"::notice::Deploy key OK for project {d['project_id']} ({d['client_email']})")
          PY

      - name: Publish Firestore security rules
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set +e
          npx --yes firebase-tools@latest deploy --only firestore:rules --project bigpayrolls-6ec80 --non-interactive 2>&1 | tee rules.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::warning::Could not publish Firestore rules automatically. Paste firestore.rules into Firebase > Firestore > Rules and click Publish."
            grep -iE "error|denied|permission" rules.log | tail -n 5 | while IFS= read -r line; do echo "::warning::${line}"; done
          else
            echo "::notice::Firestore security rules published"
          fi
          exit $status

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set +e
          npx --yes firebase-tools@latest deploy --only hosting --project bigpayrolls-6ec80 --non-interactive 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -iE "error|denied|permission|not enabled|not found|failed|HTTP" deploy.log | tail -n 12 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          rm -f "$RUNNER_TEMP/sa.json"
          exit $status
