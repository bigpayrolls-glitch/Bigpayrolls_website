name: Fetch photos
on:
  push:
    branches: [photo-review]
    paths: [final.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p final
          while read -r name id; do
            [ -z "$name" ] && continue
            curl -fsSL -A "Mozilla/5.0" -o "final/$name.jpg" "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=1400" || echo "::warning::failed $name $id"
          done < final.txt
          ls -la final
          git config user.name "photo-bot"; git config user.email "photo-bot@users.noreply.github.com"
          git add final && git commit -m "Add final photos" && git push
