name: Live landing page check
on:
  push:
    branches: [live-check]
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://bigpayrolls.com/ -o home.html
          grep -oE "also trading as Big AutoGrid|No\. 27, Abhilasha[^<\"]*560091, Karnataka|tel:[+0-9]+|\"alternateName\":\"[^\"]*\"" home.html | sort -u
