name: Test Firestore rules
on:
  push:
    branches: [rules-test]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npx firebase emulators:exec --only firestore --project demo-bp "node test.mjs" 2>&1 | tee out.log; exit ${PIPESTATUS[0]}
      - if: always()
        run: grep -E "^(PASS|FAIL)" out.log | while read -r l; do case "$l" in FAIL*) echo "::error::$l";; esac; done; tail -3 out.log
